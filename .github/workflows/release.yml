name: Build & Release

on:
  push:
    tags:
      - "v*" # реліз збирається автоматично при пуші тега v1.0.0, v1.1.0, ...

permissions:
  contents: write # дозвіл створювати Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Ставимо компілятор і збираємо C++ ядро твоїм же build.bat -> travelcore.dll
      - name: Install MinGW
        run: choco install mingw -y

      - name: Build C++ core
        run: |
          refreshenv
          .\Code\build.bat

      # 2. Залежності GUI + PyInstaller
      - name: Install Python deps
        run: pip install pyinstaller PyQt6

      # 3. Збираємо GUI у папку (onedir, без консолі)
      - name: Package GUI with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name TravelSystem `
            --distpath dist --workpath .pybuild --specpath .pybuild `
            Code\View\app.py

      # 4. Складаємо папку апки: View/ (exe) + Controllers/ (dll) + DataBase/ (json)
      #    так, щоб відносні шляхи ../Controllers і ../DataBase з app.py знаходились
      - name: Compose app folder
        shell: cmd
        run: |
          REM View НЕ створюємо заздалегідь: інакше move покладе TravelSystem ВСЕРЕДИНУ View,
          REM а run.bat/lnk чекають exe прямо в TravelSystemApp\View\TravelSystem.exe
          mkdir dist\TravelSystemApp\Controllers dist\TravelSystemApp\DataBase
          move dist\TravelSystem dist\TravelSystemApp\View
          copy Code\Controllers\travelcore.dll dist\TravelSystemApp\Controllers\
          copy Code\DataBase\travel_db.json dist\TravelSystemApp\DataBase\
          xcopy Code\View\images dist\TravelSystemApp\View\images\ /E /I /Y

      # 5. Файли запуску ЛЕЖАТЬ ЗОВНІ папки програми (на рівень вище, поруч з нею).
      #    Шляхи у них ВІДНОСНІ, тому після розпакування архіву будь-де все працює.
      #    (Раніше ярлик створювався з абсолютним шляхом раннера D:\a\... — тому був "пустий".)
      - name: Create run.bat launcher (outside app folder)
        shell: cmd
        run: |
          (
            echo @echo off
            echo cd /d "%%~dp0TravelSystemApp\View"
            echo start "" "TravelSystem.exe"
          ) > dist\run.bat

      - name: Create TravelSystem.lnk shortcut (outside app folder, relative paths)
        shell: powershell
        run: |
          Set-Location dist
          $ws = New-Object -ComObject WScript.Shell
          $lnk = $ws.CreateShortcut((Join-Path (Get-Location) 'TravelSystem.lnk'))
          $lnk.TargetPath = 'TravelSystemApp\View\TravelSystem.exe'
          $lnk.WorkingDirectory = 'TravelSystemApp\View'
          $lnk.IconLocation = 'TravelSystemApp\View\TravelSystem.exe,0'
          $lnk.Save()

      # 6. Архівуємо: в архіві буде папка TravelSystemApp/ + run.bat + TravelSystem.lnk поруч з нею.
      #    Zip кладемо в корінь репо (не в dist), щоб він не потрапив сам у себе.
      - name: Zip
        run: powershell -NoProfile -Command "Compress-Archive -Path dist\* -DestinationPath TravelSystemApp-win.zip -Force"

      # 7. Публікуємо Release з цим zip автоматично
      - uses: softprops/action-gh-release@v2
        with:
          files: TravelSystemApp-win.zip
          generate_release_notes: true
